services:
  server:
    image: redash/redash:latest
    command: server
    depends_on:
      - postgres
      - redis
    ports:
      - "5000:5000"
    environment:
      REDASH_LOG_LEVEL: "INFO"
      REDASH_REDIS_URL: "redis://redis:6379/0"
      REDASH_DATABASE_URL: "postgresql://postgres:postgres@postgres/postgres"
      REDASH_COOKIE_SECRET: "local_dev_cookie_secret_123"
      REDASH_SECRET_KEY: "local_dev_secret_key_456"
    restart: always

  scheduler:
    image: redash/redash:latest
    command: scheduler
    depends_on:
      - server
    environment:
      REDASH_LOG_LEVEL: "INFO"
      REDASH_REDIS_URL: "redis://redis:6379/0"
      REDASH_DATABASE_URL: "postgresql://postgres:postgres@postgres/postgres"
      REDASH_COOKIE_SECRET: "local_dev_cookie_secret_123"
      REDASH_SECRET_KEY: "local_dev_secret_key_456"
    restart: always

  worker:
    image: redash/redash:latest
    command: worker
    depends_on:
      - server
    environment:
      REDASH_LOG_LEVEL: "INFO"
      REDASH_REDIS_URL: "redis://redis:6379/0"
      REDASH_DATABASE_URL: "postgresql://postgres:postgres@postgres/postgres"
      REDASH_COOKIE_SECRET: "local_dev_cookie_secret_123"
      REDASH_SECRET_KEY: "local_dev_secret_key_456"
    restart: always

  redis:
    image: redis:7-alpine
    restart: always

  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data: